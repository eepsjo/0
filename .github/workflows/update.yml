name: Update Rules

on:
  workflow_dispatch:
  push:
    branches: ['0']
    paths: ['base/**', 'oth/**', 'scripts/**']
  schedule:
    - cron: '0 */8 * * *'

permissions:
  contents: write
  actions: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout codebase
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests pyyaml

    - name: Run update script
      run: python scripts/main.py

    - name: Deploy to release branch
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 暂存生成的文件
        mkdir -p /tmp/output
        mv output/*.txt /tmp/output/
        
        # 切换到 release 分支（如果不存在则创建孤儿分支）
        git checkout --orphan release || git checkout release
        git rm -rf .
        git clean -fd
        
        # 移回生成的文件并提交推送
        mv /tmp/output/*.txt .
        git add *.txt
        git commit -m "Auto update rule sets (release branch)"
        git push -f origin release

    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 1